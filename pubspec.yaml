name: crib_x
description: "cribx"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  get: ^4.7.3
  dio: ^5.11.1
  image_picker: ^1.2.3
  connectivity_plus: ^7.3.1
  flutter_secure_storage: ^11.2.0
  google_fonts: ^9.0.0
  flutter_svg: ^2.3.0
  cached_network_image: ^4.0.4
  shimmer: ^4.0.0
  flutter_dotenv: ^6.0.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
